name: Deploy KingHost

on:
  workflow_dispatch:

concurrency:
  group: kinghost-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy frontend assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate FTP secrets
        env:
          KINGHOST_FTP_SERVER: ${{ secrets.KINGHOST_FTP_SERVER }}
          KINGHOST_FTP_USERNAME: ${{ secrets.KINGHOST_FTP_USERNAME }}
          KINGHOST_FTP_PASSWORD: ${{ secrets.KINGHOST_FTP_PASSWORD }}
        run: |
          missing=0
          for secret_name in KINGHOST_FTP_SERVER KINGHOST_FTP_USERNAME KINGHOST_FTP_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::GitHub Actions secret ${secret_name} is required for KingHost deploy."
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy build to KingHost
        env:
          FTP_SERVER: ${{ secrets.KINGHOST_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.KINGHOST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          FTP_BASE_DIR: ${{ secrets.KINGHOST_FTP_BASE_DIR || '/home/pecp' }}
        run: |
          set -euo pipefail

          cat > /tmp/lftp-settings <<'EOF'
          set cmd:fail-exit true
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set ftp:passive-mode true
          set ftp:ssl-allow false
          EOF

          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER:21" <<EOF
          source /tmp/lftp-settings
          lcd public/build
          cd "$FTP_BASE_DIR"

          cd build
          mirror --reverse --verbose --parallel=2 ./ ./

          cd "$FTP_BASE_DIR/public/build"
          mirror --reverse --verbose --parallel=2 ./ ./

          cd "$FTP_BASE_DIR/www/build"
          mirror --reverse --verbose --parallel=2 ./ ./

          bye
          EOF

          echo "Deploy concluido com sucesso"
