name: Deploy KingHost

on:
  workflow_dispatch:

concurrency:
  group: kinghost-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy frontend assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate FTP secrets
        env:
          KINGHOST_FTP_SERVER: ${{ secrets.KINGHOST_FTP_SERVER }}
          KINGHOST_FTP_USERNAME: ${{ secrets.KINGHOST_FTP_USERNAME }}
          KINGHOST_FTP_PASSWORD: ${{ secrets.KINGHOST_FTP_PASSWORD }}
        run: |
          missing=0
          for secret_name in KINGHOST_FTP_SERVER KINGHOST_FTP_USERNAME KINGHOST_FTP_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::GitHub Actions secret ${secret_name} is required for KingHost deploy."
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy build to KingHost
        env:
          FTP_SERVER: ${{ secrets.KINGHOST_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.KINGHOST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.KINGHOST_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import ftplib
          import os
          import posixpath
          from pathlib import Path

          server = os.environ["FTP_SERVER"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]

          local_root = Path("public/build")
          remote_roots = ["build", "public/build", "www/build"]

          def ensure_dir(ftp, path):
              original = ftp.pwd()
              try:
                  for part in [p for p in path.split("/") if p and p != "."]:
                      try:
                          ftp.cwd(part)
                      except ftplib.error_perm:
                          ftp.mkd(part)
                          ftp.cwd(part)
              finally:
                  ftp.cwd(original)

          def upload_to_root(remote_root):
              with ftplib.FTP(server, timeout=60) as ftp:
                  ftp.login(username, password)
                  ftp.set_pasv(True)
                  ftp.cwd(remote_root)
                  destination_root = ftp.pwd()
                  print(f"Uploading {local_root} to {destination_root}")

                  for file_path in sorted(local_root.rglob("*")):
                      if not file_path.is_file():
                          continue

                      rel = file_path.relative_to(local_root).as_posix()
                      remote_dir = posixpath.dirname(rel)
                      remote_name = posixpath.basename(rel)

                      ftp.cwd(destination_root)
                      if remote_dir:
                          ensure_dir(ftp, remote_dir)
                          ftp.cwd(posixpath.join(destination_root, remote_dir))

                      with file_path.open("rb") as handle:
                          ftp.storbinary(f"STOR {remote_name}", handle)

          for remote_root in remote_roots:
              upload_to_root(remote_root)
          PY

          echo "Deploy concluido com sucesso"
