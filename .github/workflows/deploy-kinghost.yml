name: Deploy KingHost

on:
  workflow_dispatch:

concurrency:
  group: kinghost-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy frontend assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate FTP secrets
        env:
          KINGHOST_FTP_SERVER: ${{ secrets.KINGHOST_FTP_SERVER }}
          KINGHOST_FTP_USERNAME: ${{ secrets.KINGHOST_FTP_USERNAME }}
          KINGHOST_FTP_PASSWORD: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          KINGHOST_FTP_SERVER_DIR: ${{ secrets.KINGHOST_FTP_SERVER_DIR }}
          KINGHOST_FTP_BUILD_DIR: ${{ secrets.KINGHOST_FTP_BUILD_DIR }}
          KINGHOST_FTP_PORT: ${{ secrets.KINGHOST_FTP_PORT }}
          KINGHOST_FTP_TIMEOUT: ${{ secrets.KINGHOST_FTP_TIMEOUT }}
        run: |
          missing=0
          for secret_name in KINGHOST_FTP_SERVER KINGHOST_FTP_USERNAME KINGHOST_FTP_PASSWORD KINGHOST_FTP_SERVER_DIR; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::GitHub Actions secret ${secret_name} is required for KingHost deploy."
              missing=1
            fi
          done

          port="${KINGHOST_FTP_PORT:-21}"
          timeout="${KINGHOST_FTP_TIMEOUT:-300000}"
          server_dir="${KINGHOST_FTP_SERVER_DIR:-./}"
          build_dir="${KINGHOST_FTP_BUILD_DIR:-.}"

          if [ "$server_dir" = "~" ] || [ "$server_dir" = "~/" ] || [ "$server_dir" = "www" ] || [ "$server_dir" = "www/" ] || [[ "$server_dir" == /home/* ]]; then
            server_dir="./"
          fi
          if [ "$build_dir" = "~" ] || [ "$build_dir" = "~/" ] || [[ "$build_dir" == /home/* ]]; then
            build_dir="."
          fi

          if ! [[ "$port" =~ ^[0-9]+$ ]]; then
            echo "::error::KINGHOST_FTP_PORT must be a numeric port."
            missing=1
          fi

          if ! [[ "$timeout" =~ ^[0-9]+$ ]]; then
            echo "::error::KINGHOST_FTP_TIMEOUT must be a numeric timeout in milliseconds."
            missing=1
          fi

          echo "KINGHOST_DEPLOY_PORT=$port" >> "$GITHUB_ENV"
          echo "KINGHOST_DEPLOY_TIMEOUT=$timeout" >> "$GITHUB_ENV"
          echo "KINGHOST_FTP_SERVER_DIR=$server_dir" >> "$GITHUB_ENV"
          echo "KINGHOST_FTP_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"

          echo "KingHost deploy connection: protocol=ftp port=$port timeout=${timeout}ms"
          echo "KingHost FTP root: $server_dir"
          echo "KingHost FTP build directory: $build_dir"
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy build to KingHost
        env:
          KINGHOST_FTP_SERVER: ${{ secrets.KINGHOST_FTP_SERVER }}
          KINGHOST_FTP_USERNAME: ${{ secrets.KINGHOST_FTP_USERNAME }}
          KINGHOST_FTP_PASSWORD: ${{ secrets.KINGHOST_FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          import ftplib
          import os
          import time
          from pathlib import Path

          server = os.environ["KINGHOST_FTP_SERVER"]
          username = os.environ["KINGHOST_FTP_USERNAME"]
          password = os.environ["KINGHOST_FTP_PASSWORD"]
          port = int(os.environ.get("KINGHOST_DEPLOY_PORT", "21"))
          timeout = int(os.environ.get("KINGHOST_DEPLOY_TIMEOUT", "300000")) / 1000
          ftp_root = os.environ.get("KINGHOST_FTP_SERVER_DIR", "./").strip()
          ftp_build_dir = os.environ.get("KINGHOST_FTP_BUILD_DIR", ".").strip()

          if not ftp_root or ftp_root in {".", "./", "~", "~/", "www", "www/"} or ftp_root.startswith("/home/"):
              ftp_root = ""
          ftp_root = ftp_root.strip("/")
          if not ftp_build_dir or ftp_build_dir in {".", "./", "~", "~/"} or ftp_build_dir.startswith("/home/"):
              ftp_build_dir = "."
          ftp_build_dir = ftp_build_dir.strip("/")
          if ftp_build_dir == "":
              ftp_build_dir = "."

          local_root = Path("public/build")
          remote_roots = [ftp_build_dir]

          if not local_root.is_dir():
              raise SystemExit("public/build was not generated by npm run build.")

          def retry(operation, label, attempts=5):
              last_error = None
              for attempt in range(1, attempts + 1):
                  try:
                      return operation()
                  except (OSError, EOFError, ftplib.Error) as error:
                      last_error = error
                      if attempt == attempts:
                          break
                      print(f"{label} failed on attempt {attempt}; retrying in 5s: {error}")
                      time.sleep(5)
              raise RuntimeError(f"{label} failed after {attempts} attempts: {last_error}")

          def connect():
              ftp = ftplib.FTP()
              ftp.connect(server, port, timeout=timeout)
              ftp.login(username, password)
              ftp.set_pasv(True)
              return ftp

          def ensure_dir(ftp, path):
              for part in [part for part in path.split("/") if part and part != "."]:
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          def upload_tree(remote_root):
              with connect() as ftp:
                  if ftp_root:
                      ftp.cwd(ftp_root)
                  if remote_root != ".":
                      ensure_dir(ftp, remote_root)
                  print(f"Uploading {local_root} to {remote_root}")

                  for file_path in sorted(local_root.rglob("*")):
                      if not file_path.is_file():
                          continue

                      rel = file_path.relative_to(local_root).as_posix()
                      remote_path = rel

                      def upload_file():
                          with file_path.open("rb") as handle:
                              ftp.storbinary(f"STOR {remote_path}", handle)

                      retry(upload_file, f"upload {remote_root}/{rel}")

          print(f"Deploying Vite build assets to KingHost FTP root: {ftp_root or './'}")
          for remote_root in remote_roots:
              retry(lambda root=remote_root: upload_tree(root), f"upload tree {remote_root}")
          PY

          echo "Deploy concluido com sucesso"
